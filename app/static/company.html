<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Company Information</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    padding:40px;
}
.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:35px;
    border-radius:16px;
}
h1{
    text-align:center;
    font-size:48px;
    margin-bottom:10px;
}
.sub{
    text-align:center;
    color:#6B7280;
    margin-bottom:35px;
}
.card{
    border:1px solid #E5E7EB;
    border-radius:16px;
    padding:25px;
    margin-bottom:25px;
    background:#fff;
}
input{
    width:100%;
    padding:14px;
    margin-bottom:14px;
    border:1px solid #D1D5DB;
    border-radius:10px;
    font-size:16px;
    box-sizing:border-box;
}
button{
    padding:16px;
    background:#111827;
    color:white;
    border:none;
    border-radius:12px;
    font-size:18px;
    cursor:pointer;
}
.full{
    width:100%;
    margin-top:10px;
}
.small{
    width:220px;
    margin-bottom:25px;
}
.result{
    margin-top:20px;
    color:#059669;
    font-weight:bold;
}
</style>
</head>

<body>
<div class="container">

<a href="/">
<button class="small">← Dashboard</button>
</a>

<h1>Company Information</h1>
<p class="sub">Manage company information for trade documents</p>

<div class="card">
<h2>Company Master</h2>

<input id="name" placeholder="Company Name">
<input id="address" placeholder="Address">
<input id="email" placeholder="Email">
<input id="phone" placeholder="Phone">
</div>

<button class="full" onclick="saveCompany()">Save Company</button>

<div class="result" id="result"></div>

</div>

<script>
async function loadCompany(){
    try{
        const response = await fetch("/company-data");
        const data = await response.json();

        document.getElementById("name").value = data.name || "";
        document.getElementById("address").value = data.address || "";
        document.getElementById("email").value = data.email || "";
        document.getElementById("phone").value = data.phone || "";
    }catch(e){
        document.getElementById("result").innerHTML =
            "Failed to load company information.";
        document.getElementById("result").style.color = "#DC2626";
    }
}

async function saveCompany(){
    const data = {
        name: document.getElementById("name").value,
        address: document.getElementById("address").value,
        email: document.getElementById("email").value,
        phone: document.getElementById("phone").value
    };

    try{
        const response = await fetch("/save-company",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify(data)
        });

        if(!response.ok){
            throw new Error("Save failed");
        }

        document.getElementById("result").innerHTML =
            "✓ Company saved successfully.";
        document.getElementById("result").style.color = "#059669";
        if(window.tpMarkSaved) window.tpMarkSaved();
    }catch(e){
        document.getElementById("result").innerHTML =
            "Failed to save company information.";
        document.getElementById("result").style.color = "#DC2626";
    }
}

loadCompany();
</script>

</body>
</html>
