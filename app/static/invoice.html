<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    padding:40px;
}

.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:12px;
}

h1{
    margin-bottom:20px;
}

input{
    width:100%;
    padding:15px;
    margin-bottom:15px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:16px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:16px;
    margin-bottom:10px;
    background:#0b1736;
    color:white;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}
</style>

</head>
<body>

<div class="container">

<h1>Invoice</h1>

<input id="seller" placeholder="Seller Name">
<input id="buyer" placeholder="Buyer Name">
<input id="item1" placeholder="Item 1 Name">
<input id="qty1" type="number" placeholder="Item 1 Quantity">
<input id="price1" type="number" placeholder="Item 1 Unit Price">

<input id="item2" placeholder="Item 2 Name">
<input id="qty2" type="number" placeholder="Item 2 Quantity">
<input id="price2" type="number" placeholder="Item 2 Unit Price">

<input id="item3" placeholder="Item 3 Name">
<input id="qty3" type="number" placeholder="Item 3 Quantity">
<input id="price3" type="number" placeholder="Item 3 Unit Price">


<button onclick="generatePDF()">
Generate Invoice PDF
</button>

<button onclick="saveInvoice()">
Save Invoice
</button>

</div>

<script>

async function saveInvoice(){

    const data = {
        seller: document.getElementById("seller").value,
        buyer: document.getElementById("buyer").value,
        items:[
    {
        name: document.getElementById("item1").value,
        quantity: Number(document.getElementById("qty1").value),
        unit_price: Number(document.getElementById("price1").value)
    },
    {
        name: document.getElementById("item2").value,
        quantity: Number(document.getElementById("qty2").value),
        unit_price: Number(document.getElementById("price2").value)
    },
    {
        name: document.getElementById("item3").value,
        quantity: Number(document.getElementById("qty3").value),
        unit_price: Number(document.getElementById("price3").value)
    }
]
    };

    const response = await fetch("/invoice",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify(data)
    });

    const result = await response.json();

    alert("Invoice Saved : " + result.invoice_no);
}

async function generatePDF(){

    const companyResponse = await fetch("/company-data");
    const company = await companyResponse.json();

    const data = {
        seller: company.name || document.getElementById("seller").value,
        seller_address: company.address || "",
        seller_email: company.email || "",

        buyer: document.getElementById("buyer").value,
       items:[
    {
        name: document.getElementById("item1").value,
        quantity: Number(document.getElementById("qty1").value),
        unit_price: Number(document.getElementById("price1").value)
    },
    {
        name: document.getElementById("item2").value,
        quantity: Number(document.getElementById("qty2").value),
        unit_price: Number(document.getElementById("price2").value)
    },
    {
        name: document.getElementById("item3").value,
        quantity: Number(document.getElementById("qty3").value),
        unit_price: Number(document.getElementById("price3").value)
    }
]
    };

    const response = await fetch("/invoice/pdf",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify(data)
    });

    const blob = await response.blob();
    const url = window.URL.createObjectURL(blob);
    window.open(url);
}

</script>

</body>
</html>
