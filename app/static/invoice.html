<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoice</title>
<style>
body{font-family:Arial;background:#f3f4f6;padding:40px;}
.container{max-width:900px;margin:auto;background:white;padding:35px;border-radius:16px;}
h1{text-align:center;font-size:48px;margin-bottom:10px;}
.sub{text-align:center;color:#6B7280;margin-bottom:35px;}
input,select{width:100%;padding:14px;margin-bottom:14px;border:1px solid #D1D5DB;border-radius:10px;font-size:16px;box-sizing:border-box;}
.card{border:1px solid #E5E7EB;border-radius:16px;padding:25px;margin-bottom:25px;background:#fff;}
button{padding:16px;background:#111827;color:white;border:none;border-radius:12px;font-size:18px;cursor:pointer;}
.full{width:100%;margin-top:10px;}
.total{font-size:26px;font-weight:bold;margin:25px 0;}
.back button{width:220px;margin-bottom:25px;}
.demo-preview{display:none;padding:16px;margin-bottom:20px;border:1px solid #BFDBFE;border-radius:12px;background:#EFF6FF;color:#1E3A8A;line-height:1.5;}
</style>
</head>

<body>
<div class="container">

<a class="back" href="/">
<button>← Dashboard</button>
</a>

<h1>Invoice</h1>
<p class="sub">Create invoice from customer and product master data</p>
<div class="demo-preview" id="demo-preview"><b>Demo Preview</b><br>Temporary values — nothing is saved until you press Save.</div>

<div class="card">
<h2>Invoice Information</h2>
<input id="currency" name="currency" value="USD" placeholder="Currency">
</div>

<div class="card">
<h2>Seller Information</h2>

<select id="sellerSelect" onchange="selectSeller()">
<option value="">Select Seller Company</option>
</select>

<input id="seller" placeholder="Seller Name">
<input id="seller_address" placeholder="Seller Address">
<input id="seller_email" placeholder="Seller Email">
<input id="seller_phone" placeholder="Seller Phone">
</div>

<div class="card">
<h2>Buyer Information</h2>

<select id="buyerCompanySelect" onchange="selectBuyerCompany()">
<option value="">Select Buyer Company</option>
</select>

<input id="buyer" placeholder="Buyer Name">
<input id="buyer_address" placeholder="Buyer Address">
<input id="buyer_email" placeholder="Buyer Email">
</div>

<div class="card">
<h2>Product Information</h2>

<select id="product1" onchange="selectProduct(1)">
<option value="">Select Product Master</option>
</select>

<input id="item1" placeholder="Product Name">
<input id="hs1" placeholder="HS Code">
<input id="qty1" type="number" placeholder="Quantity" oninput="calculateTotal()">
<input id="price1" type="number" placeholder="Unit Price" oninput="calculateTotal()">
</div>

<div class="total" id="total">Total: USD 0</div>

<button class="full" onclick="generatePDF()">Generate Invoice PDF</button>
<button class="full" onclick="saveInvoice()">Save Invoice</button>

</div>

<script>
let products = [];
let companies = [];
let buyers = [];

function getPiNoFromUrl(){
    const params = new URLSearchParams(window.location.search);
    return params.get("pi_no");
}

async function loadProducts(){
    const response = await fetch("/product-data");
    products = await response.json();

    const select = document.getElementById("product1");
    select.innerHTML = '<option value="">Select Product Master</option>';

    products.forEach((product, index) => {
        const option = document.createElement("option");
        option.value = index;
        option.textContent = product.name;
        select.appendChild(option);
    });
}

function selectProduct(number){
    const index = document.getElementById("product" + number).value;
    if(index === "") return;

    const product = products[index];

    document.getElementById("item" + number).value = product.name || "";
    document.getElementById("price" + number).value = product.unit_price || 0;
    document.getElementById("hs" + number).value = product.hs_code || "";
    calculateTotal();
}

function getItems(){
    const name = document.getElementById("item1").value;
    const quantity = Number(document.getElementById("qty1").value || 0);
    const unit_price = Number(document.getElementById("price1").value || 0);

    if(!name) return [];
    return [{
    name: name,
    hs_code: document.getElementById("hs1").value,
    quantity: quantity,
    unit_price: unit_price
}];
    }

function calculateTotal(){
    const items = getItems();
    const total = items.reduce((sum, item) => sum + item.quantity * item.unit_price, 0);
    document.getElementById("total").innerHTML = "Total: USD " + total;
}

async function saveInvoice(){
    const data = {
        seller: document.getElementById("seller").value,
        seller_address: document.getElementById("seller_address").value,
        seller_email: document.getElementById("seller_email").value,
        seller_phone: document.getElementById("seller_phone").value,
        currency: document.getElementById("currency").value,
        buyer: document.getElementById("buyer").value,
        buyer_address: document.getElementById("buyer_address").value,
        buyer_email: document.getElementById("buyer_email").value,
        items: getItems()
    };

    const response = await fetch("/invoice",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(data)
    });

    const result = await response.json();
    alert("Invoice Saved : " + result.invoice_no);
    window.location.href = "/invoice-list";
}

async function generatePDF(){
    const data = {
        seller: document.getElementById("seller").value,
        seller_address: document.getElementById("seller_address").value,
        seller_email: document.getElementById("seller_email").value,
        seller_phone: document.getElementById("seller_phone").value,
        buyer: document.getElementById("buyer").value,
        buyer_address: document.getElementById("buyer_address").value,
        buyer_email: document.getElementById("buyer_email").value,
        items: getItems()
    };

    const response = await fetch("/invoice/pdf",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(data)
    });

    const blob = await response.blob();
    const url = window.URL.createObjectURL(blob);
    window.open(url);
}

async function loadCompany(){
    const response = await fetch("/company-data");
    const data = await response.json();
    companies = Array.isArray(data) ? data : [data];

    const sellerSelect = document.getElementById("sellerSelect");
    sellerSelect.innerHTML = '<option value="">Select Seller Company</option>';

    companies.forEach((company, index) => {
        if(company && (company.name || company.address || company.email || company.phone)){
            const name = company.name || "Company";
            sellerSelect.innerHTML += `<option value="${index}">${name}</option>`;
        }
    });

    if(companies.length === 1 && !getPiNoFromUrl()){
        sellerSelect.value = "0";
        selectSeller();
    }
}

async function loadBuyers(){
    const response = await fetch("/buyer-data");
    buyers = await response.json();
    if(!Array.isArray(buyers)) buyers = [];

    const buyerCompanySelect = document.getElementById("buyerCompanySelect");
    buyerCompanySelect.innerHTML = '<option value="">Select Buyer Company</option>';

    buyers.forEach((buyer, index) => {
        if(buyer && (buyer.name || buyer.address || buyer.email)){
            const option = document.createElement("option");
            option.value = index;
            option.textContent = buyer.name || "Buyer";
            buyerCompanySelect.appendChild(option);
        }
    });
}

function selectSeller(){
    const index = document.getElementById("sellerSelect").value;
    if(index === "") return;

    const company = companies[index] || {};

    document.getElementById("seller").value = company.name || "";
    document.getElementById("seller_address").value = company.address || "";
    document.getElementById("seller_email").value = company.email || "";
    document.getElementById("seller_phone").value = company.phone || "";
}

function selectBuyerCompany(){
    const index = document.getElementById("buyerCompanySelect").value;
    if(index === "") return;

    const buyer = buyers[index] || {};

    document.getElementById("buyer").value = buyer.name || "";
    document.getElementById("buyer_address").value = buyer.address || "";
    document.getElementById("buyer_email").value = buyer.email || "";
}

async function loadProformaPrefill(){
    const piNo = getPiNoFromUrl();
    if(!piNo) return;

    const response = await fetch("/proforma-data/" + encodeURIComponent(piNo));
    if(!response.ok) return;

    const proforma = await response.json();
    const firstItem = proforma.items && proforma.items.length > 0 ? proforma.items[0] : {};

    if(proforma.currency){
        document.getElementById("currency").value = proforma.currency;
    }

    document.getElementById("seller").value = proforma.seller || "";

    const matchedCompany = companies.find(company => company.name === proforma.seller);
    if(matchedCompany){
        document.getElementById("seller_address").value = matchedCompany.address || "";
        document.getElementById("seller_email").value = matchedCompany.email || "";
        document.getElementById("seller_phone").value = matchedCompany.phone || "";
    }

    document.getElementById("buyer").value = proforma.buyer || "";
    document.getElementById("buyer_address").value = proforma.buyer_address || "";
    document.getElementById("buyer_email").value = proforma.buyer_email || "";

    document.getElementById("item1").value = firstItem.name || "";
    document.getElementById("hs1").value = firstItem.hs_code || "";
    document.getElementById("qty1").value = firstItem.qty || "";
    document.getElementById("price1").value = firstItem.unit_price || "";

    calculateTotal();
}

function applyDemoPrefill(){
    const params = new URLSearchParams(window.location.search);
    if(params.get("demo") !== "1" || getPiNoFromUrl()) return;

    document.getElementById("demo-preview").style.display = "block";
    const companyIndex = companies.findIndex(company => company && company.name === "Busan Comfort Trading");
    if(companyIndex >= 0){
        document.getElementById("sellerSelect").value = String(companyIndex);
        selectSeller();
    }else{
        document.getElementById("seller").value = "Busan Comfort Trading";
    }

    const buyerIndex = buyers.findIndex(buyer => buyer && buyer.name === "Sakura Retail Co.");
    if(buyerIndex >= 0){
        document.getElementById("buyerCompanySelect").value = String(buyerIndex);
        selectBuyerCompany();
    }else{
        document.getElementById("buyer").value = "Sakura Retail Co.";
        document.getElementById("buyer_address").value = "Tokyo, Japan";
        document.getElementById("buyer_email").value = "buyer@example.jp";
    }

    const productIndex = products.findIndex(product => product && product.name === "Notebook Computer");
    if(productIndex >= 0){
        document.getElementById("product1").value = String(productIndex);
        selectProduct(1);
    }else{
        document.getElementById("item1").value = "Notebook Computer";
        document.getElementById("hs1").value = "847130";
        document.getElementById("price1").value = "850";
    }
    document.getElementById("qty1").value = "1";
    calculateTotal();
}

window.onload = async function(){
    await loadCompany();
    await loadBuyers();
    await loadProducts();
    await loadProformaPrefill();
    applyDemoPrefill();
};

</script>

</body>
</html>
