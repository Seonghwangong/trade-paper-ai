<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    padding:40px;
}
.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:12px;
}
h1{ margin-bottom:20px; }
input, select{
    width:100%;
    padding:15px;
    margin-bottom:15px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:16px;
    box-sizing:border-box;
}
button{
    width:100%;
    padding:16px;
    margin-bottom:10px;
    background:#0b1736;
    color:white;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}
button:hover{ opacity:0.9; }
.item-box{
    border:1px solid #e5e7eb;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
    background:#f9fafb;
}
.total{
    font-size:22px;
    font-weight:bold;
    margin:20px 0;
}
.back{
    display:block;
    margin-bottom:20px;
}
</style>
</head>

<body>

<div class="container">

<a class="back" href="/">← Back Home</a>

<h1>Invoice</h1>

<input id="seller" placeholder="Seller Name">
<select id="buyerSelect" onchange="selectBuyer()">
    <option value="">Select Buyer</option>
</select>

<input id="buyer" placeholder="Buyer Name">
<input id="buyer_address" placeholder="Buyer Address">
<input id="buyer_email" placeholder="Buyer Email">

<div class="item-box">
    <select id="product1" onchange="selectProduct(1)">
        <option value="">Select Product 1</option>
    </select>
    <input id="item1" placeholder="Item 1 Name">
    <input id="hs1" placeholder="HS Code">
    <input id="qty1" type="number" placeholder="Item 1 Quantity" oninput="calculateTotal()">
    <input id="price1" type="number" placeholder="Item 1 Unit Price" oninput="calculateTotal()">
</div>

<div class="item-box">
    <select id="product2" onchange="selectProduct(2)">
        <option value="">Select Product 2</option>
    </select>
    <input id="item2" placeholder="Item 2 Name">
    <input id="hs2" placeholder="HS Code">
    <input id="qty2" type="number" placeholder="Item 2 Quantity" oninput="calculateTotal()">
    <input id="price2" type="number" placeholder="Item 2 Unit Price" oninput="calculateTotal()">
</div>

<div class="item-box">
    <select id="product3" onchange="selectProduct(3)">
        <option value="">Select Product 3</option>
    </select>
    <input id="item3" placeholder="Item 3 Name">
    <input id="hs3" placeholder="HS Code">
    <input id="qty3" type="number" placeholder="Item 3 Quantity" oninput="calculateTotal()">
    <input id="price3" type="number" placeholder="Item 3 Unit Price" oninput="calculateTotal()">
</div>

<div class="total" id="total">Total: USD 0</div>

<button onclick="generatePDF()">Generate Invoice PDF</button>
<button onclick="saveInvoice()">Save Invoice</button>

</div>

<script>

let products = [];

async function loadProducts(){
    const response = await fetch("/product-data");
    products = await response.json();

    for(let i = 1; i <= 3; i++){
        const select = document.getElementById("product" + i);

        products.forEach((product, index) => {
            const option = document.createElement("option");
            option.value = index;
            option.textContent = product.name;
            select.appendChild(option);
        });
    }
}

function selectProduct(number){
    const select = document.getElementById("product" + number);
    const index = select.value;

    if(index === "") return;

    const product = products[index];

    document.getElementById("item" + number).value = product.name || "";
    document.getElementById("price" + number).value = product.unit_price || 0;
    document.getElementById("hs" + number).value = product.hs_code || "";
    calculateTotal();
}

function getItems(){
    const items = [];

    for(let i = 1; i <= 3; i++){
        const name = document.getElementById("item" + i).value;
        const quantity = Number(document.getElementById("qty" + i).value || 0);
        const unit_price = Number(document.getElementById("price" + i).value || 0);

        if(name){
            items.push({
                name: name,
                quantity: quantity,
                unit_price: unit_price
            });
        }
    }

    return items;
}

function calculateTotal(){
    const items = getItems();

    const total = items.reduce((sum, item) => {
        return sum + (item.quantity * item.unit_price);
    }, 0);

    document.getElementById("total").innerHTML = "Total: USD " + total;
}

let buyers = [];

async function loadBuyers(){

    const response = await fetch("/buyer-data");
    buyers = await response.json();

    const select = document.getElementById("buyerSelect");

    buyers.forEach((buyer,index)=>{

        select.innerHTML += `
        <option value="${index}">
            ${buyer.name}
        </option>
        `;

    });

}

function selectBuyer(){

    const index = document.getElementById("buyerSelect").value;

    if(index==="") return;

    const buyer = buyers[index];

    document.getElementById("buyer").value = buyer.name;
    document.getElementById("buyer_address").value = buyer.address;
    document.getElementById("buyer_email").value = buyer.email;

}

window.onload = loadBuyers;

async function saveInvoice(){
    const data = {
        seller: document.getElementById("seller").value,
        buyer: document.getElementById("buyer").value,
        items: getItems()
    };

    const response = await fetch("/invoice",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify(data)
    });

    const result = await response.json();

    alert("Invoice Saved : " + result.invoice_no);
}


async function generatePDF(){
    const companyResponse = await fetch("/company-data");
    const company = await companyResponse.json();

    const data = {
        seller: company.name || document.getElementById("seller").value,
        seller_address: company.address || "",
        seller_email: company.email || "",

        buyer: document.getElementById("buyer").value,
        items: getItems()
    };

    const response = await fetch("/invoice/pdf",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify(data)
    });

    const blob = await response.blob();
    const url = window.URL.createObjectURL(blob);
    window.open(url);
}

loadProducts();

</script>

</body>
</html>
