<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Packing Input</title>
</head>

<body>

<h1>Packing Input</h1>

<form action="/packing" method="post">

<p>Invoice No</p>
<select id="invoice_no" name="invoice_no" onchange="selectInvoice()">
    <option value="">Select Invoice</option>
</select>

<p>Seller</p>
<input id="seller" type="text" name="seller">

<p>Buyer</p>
<input id="buyer" type="text" name="buyer">

<p>Product</p>
<select id="product_select" onchange="selectProduct()">
    <option value="">Select Product</option>
</select>

<p>Item Name</p>
<input id="item_name" type="text" name="item_name">

<p>HS Code</p>
<input id="hs_code" type="text" name="hs_code">

<p>Carton</p>
<input type="number" name="carton">

<p>Net Weight</p>
<input type="number" step="0.01" name="net_weight">

<p>Gross Weight</p>
<input type="number" step="0.01" name="gross_weight">

<br><br>
<button type="submit">Save Packing</button>

</form>

<br>
<a href="/">Back Home</a>
<br>
<a href="/packing-list">Back to Packing List</a>

<script>
let invoices = [];
let products = [];

async function loadInvoices(){
    const response = await fetch("/invoice-data");
    invoices = await response.json();

    const select = document.getElementById("invoice_no");

    invoices.forEach((invoice, index) => {
        if(invoice.invoice_no){
            select.innerHTML +=
                '<option value="' + invoice.invoice_no + '" data-index="' + index + '">' +
                invoice.invoice_no + ' - ' + (invoice.buyer || '') +
                '</option>';
        }
    });
}

function selectInvoice(){
    const select = document.getElementById("invoice_no");
    const index = select.options[select.selectedIndex].dataset.index;

    if(index === undefined) return;

    const invoice = invoices[index];

    document.getElementById("seller").value = invoice.seller || "";
    document.getElementById("buyer").value = invoice.buyer || "";
}

async function loadProducts(){
    const response = await fetch("/product-data");
    products = await response.json();

    const select = document.getElementById("product_select");

    products.forEach((product, index) => {
        select.innerHTML +=
            '<option value="' + index + '">' +
            product.name +
            '</option>';
    });
}

function selectProduct(){
    const index = document.getElementById("product_select").value;

    if(index === "") return;

    const product = products[index];

    document.getElementById("item_name").value = product.name || "";
    document.getElementById("hs_code").value = product.hs_code || "";
}

loadInvoices();
loadProducts();
</script>

</body>
</html>
