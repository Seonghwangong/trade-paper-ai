<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Packing List</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    padding:40px;
}
.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:35px;
    border-radius:16px;
}
h1{
    text-align:center;
    font-size:48px;
    margin-bottom:10px;
}
.sub{
    text-align:center;
    color:#6B7280;
    margin-bottom:35px;
}
.card{
    border:1px solid #E5E7EB;
    border-radius:16px;
    padding:25px;
    margin-bottom:25px;
    background:#fff;
}
.item-card{
    border:1px solid #E5E7EB;
    border-radius:14px;
    padding:20px;
    margin-bottom:20px;
    background:#F9FAFB;
}
input,select{
    width:100%;
    padding:14px;
    margin-bottom:14px;
    border:1px solid #D1D5DB;
    border-radius:10px;
    font-size:16px;
    box-sizing:border-box;
}
button{
    padding:16px;
    background:#111827;
    color:white;
    border:none;
    border-radius:12px;
    font-size:18px;
    cursor:pointer;
}
.full{
    width:100%;
    margin-top:10px;
}
.small{
    width:220px;
    margin-bottom:25px;
}
.add{
    width:100%;
    background:#374151;
    margin-bottom:20px;
}
.remove{
    background:#DC2626;
    width:180px;
    font-size:15px;
    padding:12px;
}
</style>
</head>

<body>
<div class="container">

<a href="/">
<button class="small">← Dashboard</button>
</a>

<h1>Packing List</h1>
<p class="sub">Create packing list from invoice and product data</p>

<div class="card">
<h2>Invoice Information</h2>

<select id="invoice_no" onchange="loadInvoiceData()">
<option value="">Select Invoice No</option>
</select>

<input id="seller" placeholder="Seller Name">
<input id="buyer" placeholder="Buyer Name">
</div>

<div class="card">
<h2>Product Information</h2>

<div id="items_area">

<div class="item-card">
<select class="productSelect" onchange="selectProduct(this)">
<option value="">Select Product</option>
</select>

<input class="item" placeholder="Item Name">
<input class="hs_code" placeholder="HS Code">
<input class="carton" type="number" placeholder="Carton">
<input class="net_weight" placeholder="Net Weight">
<input class="gross_weight" placeholder="Gross Weight">

<button type="button" class="remove" onclick="removeItem(this)">Remove Item</button>
</div>

</div>

<button type="button" class="add" onclick="addItem()">+ Add Item</button>
</div>

<button class="full" onclick="savePacking()">Save Packing List</button>
<button class="full" onclick="generatePackingPDF()">Generate Packing PDF</button>

</div>

<script>
let products = [];

async function loadProducts(){
    try{
        const response = await fetch("/product-data");
        products = await response.json();
    }catch(e){
        products = [];
    }

    document.querySelectorAll(".productSelect").forEach(fillProductSelect);
}

function fillProductSelect(select){
    select.innerHTML = '<option value="">Select Product</option>';
    products.forEach((product, index)=>{
        select.innerHTML += `<option value="${index}">${product.name}</option>`;
    });
}

function addItem(){
    const area = document.getElementById("items_area");
    const card = document.createElement("div");
    card.className = "item-card";

    card.innerHTML = `
<select class="productSelect" onchange="selectProduct(this)">
<option value="">Select Product</option>
</select>
<input class="item" placeholder="Item Name">
<input class="hs_code" placeholder="HS Code">
<input class="carton" type="number" placeholder="Carton">
<input class="net_weight" placeholder="Net Weight">
<input class="gross_weight" placeholder="Gross Weight">
<button type="button" class="remove" onclick="removeItem(this)">Remove Item</button>
`;

    area.appendChild(card);
    fillProductSelect(card.querySelector(".productSelect"));
}

function removeItem(button){
    const cards = document.querySelectorAll(".item-card");
    if(cards.length <= 1){
        alert("At least one item is required.");
        return;
    }
    button.closest(".item-card").remove();
}

function selectProduct(select){
    const index = select.value;
    if(index === "") return;

    const product = products[index];
    const card = select.closest(".item-card");

    card.querySelector(".item").value = product.name || "";
    card.querySelector(".hs_code").value = product.hs_code || "";
}

async function loadInvoiceOptions(){
    const response = await fetch("/invoices");
    const invoices = await response.json();

    const select = document.getElementById("invoice_no");
    select.innerHTML = '<option value="">Select Invoice No</option>';

    invoices.forEach(inv=>{
        if(inv.invoice_no){
            select.innerHTML += `<option value="${inv.invoice_no}">${inv.invoice_no} - ${inv.buyer || ""}</option>`;
        }
    });
}

async function loadInvoiceData(){
    const invoiceNo = document.getElementById("invoice_no").value;
    if(!invoiceNo) return;

    const response = await fetch("/invoices");
    const invoices = await response.json();
    const invoice = invoices.find(inv => inv.invoice_no === invoiceNo);
    if(!invoice) return;

    document.getElementById("seller").value = invoice.seller || "";
    document.getElementById("buyer").value = invoice.buyer || "";

    const area = document.getElementById("items_area");
    area.innerHTML = "";

    if(invoice.items && invoice.items.length > 0){
        invoice.items.forEach(item=>{
            addItem();

            const cards = document.querySelectorAll(".item-card");
            const card = cards[cards.length - 1];

            const index = products.findIndex(p =>
                (p.name || "").toLowerCase() === (item.name || "").toLowerCase()
            );

            card.querySelector(".item").value = item.name || "";
            card.querySelector(".hs_code").value = item.hs_code || (index >= 0 ? products[index].hs_code || "" : "");

    if(index >= 0){
        card.querySelector(".productSelect").value = index;
        selectProduct(card.querySelector(".productSelect"));
    
    }
        });
    }else{
        addItem();
    }
}

function getPackingData(){
    const items = [];

    document.querySelectorAll(".item-card").forEach(card=>{
        const name = card.querySelector(".item").value;
        if(name){
            items.push({
                name: name,
                unit_price: Number(card.querySelector(".unit_price")?.value || 0),
                hs_code: card.querySelector(".hs_code").value,
                carton: Number(card.querySelector(".carton").value || 0),
                net_weight: card.querySelector(".net_weight").value,
                gross_weight: card.querySelector(".gross_weight").value
            });
        }
    });

    return {
        invoice_no: document.getElementById("invoice_no").value,
        seller: document.getElementById("seller").value,
        buyer: document.getElementById("buyer").value,
        items: items
    };
}

async function savePacking(){
    const data = getPackingData();

    const res = await fetch("/packing-list", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
    });

    const result = await res.json();
    alert("Packing Saved : " + result.packing_no);
    window.location.href = "/packing-list";
}

async function generatePackingPDF(){
    const data = getPackingData();

    const res = await fetch("/packing-list/pdf", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
    });

    const blob = await res.blob();
    const url = window.URL.createObjectURL(blob);
    window.open(url);
}

window.onload = async function(){
    await loadProducts();
    await loadInvoiceOptions();

    const params = new URLSearchParams(window.location.search);
    const invoiceNo = params.get("invoice_no");

    if(invoiceNo){
        document.getElementById("invoice_no").value = invoiceNo;
        loadInvoiceData();
    }
};
</script>

</body>
</html>
