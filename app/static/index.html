<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trade Paper AI</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    padding:40px;
}

.container{
    max-width:800px;
    margin:auto;
    background:white;
    padding:40px;
    border-radius:12px;
}

h1{
    text-align:center;
    margin-bottom:40px;
}

a{
    text-decoration:none;
}

button{
    width:100%;
    padding:18px;
    margin-bottom:15px;
    background:#0b1736;
    color:white;
    border:none;
    border-radius:10px;
    font-size:20px;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}
</style>

</head>
<body>

<div class="container">

<h1>Trade Paper AI</h1>

<div style="display:flex; gap:20px; margin-bottom:30px;">

    <a href="/invoice-list" style="text-decoration:none;">
<div style="background:#0b1736; color:white; padding:20px; border-radius:10px; min-width:180px;">
    <h3>Total Invoices</h3>
    <p style="font-size:32px; font-weight:bold;">{{INVOICE_COUNT}}</p>
    <p>View Invoice List</p>
</div>
</a>

    <a href="/packing-list" style="text-decoration:none;">
<div style="background:#0b1736; color:white; padding:20px; border-radius:10px; min-width:180px;">
    <h3>Total Packings</h3>
    <p style="font-size:32px; font-weight:bold;">{{PACKING_COUNT}}</p>
<p>View Packing List</p>
</div>
</a>

</div>

<a href="/company">
<button>Company</button>
</a>

<a href="/invoice-page">
<button>Invoice</button>
</a>

<a href="/packing-page">
<button>Packing</button>
</a>

<a href="/invoice-list">
<button>Invoice List</button>
</a>

<a href="/packing-list">
<button>Packing List</button>
</a>

</div>

</body>
</html>
