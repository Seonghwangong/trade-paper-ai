<!doctype html><html lang="__LANG__"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Import a document · Trade Paper AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f9;color:#17283d;font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#document-import{max-width:1200px;margin:auto;padding:28px 24px}nav{display:flex;justify-content:space-between;gap:16px}a{color:inherit}h1{font-size:32px;letter-spacing:-.04em;line-height:1.25;margin-bottom:12px}h2{font-size:21px}p{color:#58677a}.upload,.card{background:white;border:1px solid #d6dfe8;border-radius:18px;padding:24px;margin:20px 0}.upload{border:2px dashed #9bacbf}input,select,textarea,button{font:inherit;border:1px solid #bdc9d5;border-radius:8px;padding:9px;max-width:100%}input,textarea,select{width:100%;min-height:44px;background:white;color:#17283d}input[type=file]{padding:12px}button,.button{cursor:pointer;display:inline-block;background:#17283d;color:white;min-height:44px;padding:10px 18px;text-decoration:none;border:0}button:disabled{cursor:wait;opacity:.6}.secondary{background:#e9eef3;color:#17283d}label{display:block;font-size:14px;font-weight:650;margin-bottom:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.workspace{display:grid;grid-template-columns:.8fr 1.2fr;gap:20px;align-items:start}.source{position:sticky;top:20px}#original{width:100%;max-height:550px;object-fit:contain;background:#f5f7f9}#source-text{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.6 monospace;max-height:400px;overflow:auto}#status{white-space:pre-line;min-height:28px}#warnings{color:#774b13;background:#fff5e5;border-radius:8px;padding:12px}#warnings:empty{display:none}.item{border:1px solid #d6dfe8;padding:16px;border-radius:12px;margin:14px 0}.item-top{display:flex;justify-content:space-between;gap:16px}.item-top button{background:transparent;color:#754b43;padding:0 8px;font-size:13px}.item .grid{grid-template-columns:repeat(3,1fr)}.item input{min-width:0}.check{display:flex;gap:10px;align-items:start;font-weight:400;margin:20px 0}.check input{width:20px;min-height:20px;flex:none}.missing{border:2px solid #bf871f;background:#fffaf0}.small{font-size:13px}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}.saved{background:#eaf3ee;padding:18px;border-radius:12px}.saved a{display:inline-block;margin-right:15px}summary{cursor:pointer}input:focus-visible,button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #809bb7;outline-offset:3px}[hidden]{display:none!important}@media(max-width:800px){main{padding:20px 16px}.workspace{grid-template-columns:1fr}.source{position:static}#original{max-height:300px}.grid{grid-template-columns:1fr}.item .grid{grid-template-columns:1fr 1fr}.card,.upload{padding:18px}h1{font-size:27px}}
</style></head><body><main id="document-import">
<nav><a href="/">Trade Paper AI</a><span><a href="?lang=en">English</a> · <a href="?lang=ko">한국어</a></span></nav>
<h1 data-i18n="title"></h1><p data-i18n="intro"></p>
<section class="upload"><label for="file" data-i18n="choose"></label><input id="file" type="file" accept=".csv,.xlsx,.pdf,.jpg,.jpeg,.png,.webp"><p class="small" data-i18n="limits"></p><p class="small" data-i18n="privacy"></p><div id="sheet-box" hidden><label for="sheet" data-i18n="sheet"></label><select id="sheet"></select></div></section>
<p id="status" role="status" aria-live="polite"></p><div id="warnings" role="status"></div>
<div class="workspace" id="workspace" hidden><aside class="card source"><h2 data-i18n="source"></h2><img id="original" alt="" hidden><details open><summary data-i18n="readText"></summary><pre id="source-text" translate="no"></pre></details></aside>
<section class="card"><h2 data-i18n="review"></h2><p class="small" data-i18n="reviewHint"></p><form id="review-form" data-managed-submit="true"><div class="grid" id="fields"></div><h2 data-i18n="items"></h2><div id="items"></div><button type="button" id="add" class="secondary" data-i18n="add"></button><p id="total"></p><label class="check"><input type="checkbox" id="confirmed" required><span data-i18n="confirm"></span></label><button id="save" type="submit" data-i18n="save"></button><p class="small" data-i18n="saveHint"></p></form><div id="saved" class="saved" hidden></div></section></div>
</main><script id="import-config" type="application/json">__BOOTSTRAP__</script><script src="/static/import_layout.js" defer></script><script src="/static/document_import.js" defer></script></body></html>
