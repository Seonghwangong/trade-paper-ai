<!doctype html><html lang="__LANG__"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Import a document · Trade Paper AI</title>
<link rel="stylesheet" href="/static/document_import.css?v=20261101-notes"></head><body class="import-workspace"><main id="document-import">
<nav><a class="brand" href="/">Trade Paper AI<span class="brand-mark" aria-hidden="true"> / </span></a><span><a href="?lang=en">English</a> · <a href="?lang=ko">한국어</a></span></nav>
<header class="page-intro"><p class="eyebrow" data-i18n="eyebrow"></p><h1 data-i18n="title"></h1><p data-i18n="intro"></p></header>
<ol class="steps" aria-label="Workflow"><li data-step="1" aria-current="step"><span class="step-number">01</span><span data-i18n="stepFile"></span></li><li data-step="2"><span class="step-number">02</span><span data-i18n="stepReview"></span></li><li data-step="3"><span class="step-number">03</span><span data-i18n="stepSaved"></span></li></ol>
<div class="source-modes" role="group" aria-label="Source"><button type="button" id="source-file" aria-pressed="true" data-i18n="sourceFile"></button><button type="button" id="source-note" aria-pressed="false" data-i18n="sourceNote"></button></div>
<section class="upload" id="drop-zone" aria-busy="false"><div class="upload-main"><span class="file-mark" aria-hidden="true">↥</span><div class="upload-copy"><h2 data-i18n="choose"></h2><p data-i18n="dropHint"></p><p class="small" id="file-name" hidden></p></div><div class="file-control"><label for="file" class="file-button" data-i18n="browse"></label><input id="file" type="file" accept=".csv,.xlsx,.pdf,.jpg,.jpeg,.png,.webp" aria-describedby="file-limits"><button type="button" id="sample" class="text-button" data-i18n="sample"></button></div></div><p class="small" id="file-limits" data-i18n="shortLimits"></p><details class="file-details"><summary data-i18n="fileDetails"></summary><p class="small" data-i18n="limits"></p><p class="small" data-i18n="privacy"></p></details><div id="sheet-box" hidden><label for="sheet" data-i18n="sheet"></label><select id="sheet"></select></div></section>
<section class="card order-note" id="note-panel" aria-labelledby="note-title" hidden>
<h2 id="note-title" data-i18n="noteTitle"></h2><p class="small" data-i18n="noteHint"></p>
<label for="order-note" data-i18n="noteLabel"></label><textarea id="order-note" rows="4" maxlength="8000" aria-describedby="note-example voice-privacy"></textarea>
<p class="small" id="note-example" data-i18n="noteExample"></p>
<div class="note-actions"><button type="button" id="note-build" data-i18n="noteBuild"></button><button type="button" id="note-sample" class="text-button" data-i18n="noteSample"></button><button type="button" id="note-mic" class="secondary" aria-pressed="false" hidden data-i18n="voiceStart"></button><label id="voice-language-label" hidden><span data-i18n="voiceLanguage"></span><select id="voice-language"><option value="ko-KR">한국어</option><option value="en-US">English</option></select></label></div>
<p id="voice-privacy" class="small" data-i18n="voicePrivacy"></p><p id="voice-status" class="small" role="status" aria-live="polite"></p>
</section>
<p id="status" role="status" aria-live="polite"></p><div id="warnings" role="status"></div>
<div class="workspace" id="workspace" hidden><aside class="card source"><h2 data-i18n="source"></h2><img id="original" alt="" hidden><details open><summary data-i18n="readText"></summary><pre id="source-text" translate="no"></pre></details></aside>
<section class="card"><div class="review-heading"><h2 id="review-heading" tabindex="-1" data-i18n="review"></h2><span id="item-count" class="badge"></span></div><p id="review-hint" class="small" data-i18n="reviewHint"></p><form id="review-form" data-managed-submit="true"><section id="review-issues" class="review-issues" aria-labelledby="review-issues-title" hidden><h3 id="review-issues-title" data-i18n="reviewIssues"></h3><p class="small" data-i18n="reviewIssuesHint"></p><ul id="review-issue-list"></ul><p id="review-more" class="small" hidden></p></section><div class="grid" id="fields"></div><h2 class="section-heading" data-i18n="items"></h2><div id="items"></div><button type="button" id="add" class="secondary" data-i18n="add"></button><div class="review-footer"><div class="review-summary"><p id="total"></p><p id="review-state" class="small" role="status" aria-live="polite"></p><button id="review-next" type="button" class="text-button" data-i18n="reviewNext" hidden></button></div><label class="check"><input type="checkbox" id="confirmed" required><span data-i18n="confirm"></span></label><button id="save" type="submit" data-i18n="save"></button><p class="small" data-i18n="saveHint"></p></div></form><div id="saved" class="saved" tabindex="-1" hidden></div></section></div>
<dialog id="replace-dialog" aria-labelledby="replace-title"><form method="dialog"><h2 id="replace-title" data-i18n="replace"></h2><p class="small" data-i18n="replaceHint"></p><div class="actions"><button type="submit" value="cancel" class="secondary" autofocus data-i18n="keepDraft"></button><button type="submit" value="replace" data-i18n="replaceDraft"></button></div></form></dialog>
</main><script id="import-config" type="application/json">__BOOTSTRAP__</script><script src="/static/import_layout.js" defer></script><script src="/static/voice_input.js?v=20261101-notes" defer></script><script src="/static/document_import.js?v=20261101-notes" defer></script></body></html>
