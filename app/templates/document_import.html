<!doctype html><html lang="__LANG__"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Import a document · Trade Paper AI</title>
<link rel="stylesheet" href="/static/document_import.css?v=20261027"></head><body class="import-workspace"><main id="document-import">
<nav><a class="brand" href="/">Trade Paper AI<span class="brand-mark" aria-hidden="true"> / </span></a><span><a href="?lang=en">English</a> · <a href="?lang=ko">한국어</a></span></nav>
<header class="page-intro"><p class="eyebrow" data-i18n="eyebrow"></p><h1 data-i18n="title"></h1><p data-i18n="intro"></p></header>
<ol class="steps" aria-label="Workflow"><li data-step="1" aria-current="step"><span class="step-number">01</span><span data-i18n="stepFile"></span></li><li data-step="2"><span class="step-number">02</span><span data-i18n="stepReview"></span></li><li data-step="3"><span class="step-number">03</span><span data-i18n="stepSaved"></span></li></ol>
<section class="upload" id="drop-zone" aria-busy="false"><div class="upload-main"><span class="file-mark" aria-hidden="true">↥</span><div class="upload-copy"><h2 data-i18n="choose"></h2><p data-i18n="dropHint"></p><p class="small" id="file-name" hidden></p></div><div class="file-control"><label for="file" class="file-button" data-i18n="browse"></label><input id="file" type="file" accept=".csv,.xlsx,.pdf,.jpg,.jpeg,.png,.webp" aria-describedby="file-limits"><button type="button" id="sample" class="text-button" data-i18n="sample"></button></div></div><p class="small" id="file-limits" data-i18n="shortLimits"></p><details class="file-details"><summary data-i18n="fileDetails"></summary><p class="small" data-i18n="limits"></p><p class="small" data-i18n="privacy"></p></details><div id="sheet-box" hidden><label for="sheet" data-i18n="sheet"></label><select id="sheet"></select></div></section>
<p id="status" role="status" aria-live="polite"></p><div id="warnings" role="status"></div>
<div class="workspace" id="workspace" hidden><aside class="card source"><h2 data-i18n="source"></h2><img id="original" alt="" hidden><details open><summary data-i18n="readText"></summary><pre id="source-text" translate="no"></pre></details></aside>
<section class="card"><div class="review-heading"><h2 id="review-heading" tabindex="-1" data-i18n="review"></h2><span id="item-count" class="badge"></span></div><p id="review-hint" class="small" data-i18n="reviewHint"></p><form id="review-form" data-managed-submit="true"><div class="grid" id="fields"></div><h2 class="section-heading" data-i18n="items"></h2><div id="items"></div><button type="button" id="add" class="secondary" data-i18n="add"></button><div class="review-footer"><div class="review-summary"><p id="total"></p><p id="review-state" class="small"></p></div><label class="check"><input type="checkbox" id="confirmed" required><span data-i18n="confirm"></span></label><button id="save" type="submit" data-i18n="save"></button><p class="small" data-i18n="saveHint"></p></div></form><div id="saved" class="saved" tabindex="-1" hidden></div></section></div>
<dialog id="replace-dialog" aria-labelledby="replace-title"><form method="dialog"><h2 id="replace-title" data-i18n="replace"></h2><p class="small" data-i18n="replaceHint"></p><div class="actions"><button type="submit" value="cancel" class="secondary" autofocus data-i18n="keepDraft"></button><button type="submit" value="replace" data-i18n="replaceDraft"></button></div></form></dialog>
</main><script id="import-config" type="application/json">__BOOTSTRAP__</script><script src="/static/import_layout.js" defer></script><script src="/static/document_import.js?v=20261027" defer></script></body></html>
